controller_manager:
  ros__parameters:
    update_rate: 100

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
      - panda_finger_joint1
      - panda_finger_joint2
    interfaces: [position, velocity, effort]

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false

    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      panda_joint1: {trajectory: 0.2, goal: 0.05}
      panda_joint2: {trajectory: 0.2, goal: 0.05}
      panda_joint3: {trajectory: 0.2, goal: 0.05}
      panda_joint4: {trajectory: 0.2, goal: 0.05}
      panda_joint5: {trajectory: 0.2, goal: 0.05}
      panda_joint6: {trajectory: 0.2, goal: 0.05}
      panda_joint7: {trajectory: 0.2, goal: 0.05}

panda_hand_controller:
  ros__parameters:
    joint: panda_finger_joint1
    goal_tolerance: 0.002
    max_effort: 20.0
    allow_stalling: false
    stall_velocity_threshold: 0.001
    stall_timeout: 2.0