moveit_servo:
  move_group_name: panda_arm
  publish_period: 0.01
  max_expected_latency: 0.05
  command_in_type: speed_units
  incoming_command_timeout: 0.15
  command_out_type: trajectory_msgs/JointTrajectory
  command_out_topic: /sorting/arm/servo_output
  joint_command_in_topic: /sorting/arm/servo_joint_input
  cartesian_command_in_topic: /sorting/arm/servo_twist_input
  pose_command_in_topic: /sorting/arm/unused_pose_input
  status_topic: /sorting/arm/servo_status
  joint_topic: /joint_states
  publish_joint_positions: true
  publish_joint_velocities: true
  publish_joint_accelerations: false
  use_smoothing: true
  smoothing_filter_plugin_name: online_signal_smoothing::AccelerationLimitedPlugin
  check_collisions: true
  check_octomap_collisions: false
  collision_check_rate: 20.0
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
  lower_singularity_threshold: 17.0
  hard_stop_singularity_threshold: 30.0
  joint_limit_margins: [0.05]
  monitored_planning_scene_topic: /planning_scene
  is_primary_planning_scene_monitor: true
